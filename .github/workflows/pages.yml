name: Publier la visionneuse
on:
  push:
    branches: [main]
    paths:
      - 'Overlays/**'
      - 'Visionneuse/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lire le dépôt et tout son historique
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6
      - name: Générer le catalogue et le site
        run: python3 scripts/build_pages.py --output _site
      - name: Préparer les fichiers publiés
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v5
